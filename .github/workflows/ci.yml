name: Pilot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate synthetic pilot
        run: ./dev/check
      - name: Install BuildOpt
        uses: tonyredondo/buildopt@290f98e7600ddb03525098837cb720eedb453ee8
        with:
          version: 0.1.1
      - name: Verify BuildOpt onboarding
        run: |
          buildopt doctor
          buildopt gradle --no-daemon --stacktrace --warning-mode=fail clean pilotBuild
          test -s app/build/libs/app-1.0.0.jar
          test -s app/build/distributions/app-1.0.0.zip
          test -s build/pilot/manifest.txt
